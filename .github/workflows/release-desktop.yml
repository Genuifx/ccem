name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      recover_stale_draft:
        description: 'Resume an unpublished CCEM-owned draft for the same tag and source commit'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions: {}

jobs:
  prepare-release:
    name: Prepare Exact Tagged Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_body: ${{ steps.release-notes.outputs.release_body }}
      current_tag: ${{ steps.release-notes.outputs.current_tag }}
      version: ${{ steps.release-notes.outputs.version }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require protected release ref and main ancestry
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Manual desktop release may run only from protected main." >&2
              exit 1
            }
          else
            [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]] || {
              echo "Automatic desktop release requires a formal v* tag push." >&2
              exit 1
            }
          fi
          [[ "$REF_PROTECTED" == "true" ]] || {
            echo "Desktop release requires the selected main ref or v* tag to be protected." >&2
            exit 1
          }
          if ! main_protection_verified="$(
            gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/branches/main" \
              --jq '.protected == true'
          )"; then
            echo "Could not verify main branch protection through the GitHub API." >&2
            exit 1
          fi
          [[ "$main_protection_verified" == "true" ]] || {
            echo "Desktop release requires the main branch to be protected." >&2
            exit 1
          }
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          source_commit="$(git rev-parse "${SOURCE_COMMIT}^{commit}")"
          git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main || {
            echo "Desktop release source ${source_commit} is not reachable from origin/main." >&2
            exit 1
          }

      - name: Generate release body
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            current_tag="${GITHUB_REF_NAME}"
          else
            version="$(sed -n 's/.*"version": "\(.*\)".*/\1/p' apps/desktop/package.json | head -n1)"
            if [[ -z "$version" ]]; then
              echo "Failed to determine desktop version" >&2
              exit 1
            fi
            current_tag="v${version}"
          fi
          [[ "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Desktop release requires a formal semantic-version tag." >&2
            exit 1
          }

          git fetch --force --no-tags origin "refs/tags/${current_tag}:refs/tags/${current_tag}" || {
            echo "Release tag ${current_tag} must exist before desktop release builds start" >&2
            exit 1
          }
          tag_commit="$(git rev-parse "refs/tags/${current_tag}^{commit}")"
          source_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          [[ "$tag_commit" == "$source_commit" ]] || {
            echo "Release tag ${current_tag} does not resolve to current source ${source_commit}" >&2
            exit 1
          }

          previous_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          version="${current_tag#v}"
          echo "current_tag=${current_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          delimiter="CCEM_RELEASE_BODY_$(date +%s)"
          {
            echo "release_body<<${delimiter}"
            echo "## CCEM Desktop v${version}"
            echo
            echo "### Downloads"
            echo "- **Apple Silicon (M1/M2/M3/M4)**: \`CCEM-Desktop_*_aarch64.dmg\`"
            echo "- **Intel Mac**: \`CCEM-Desktop_*_x64.dmg\`"
            echo "- **Windows (x64)**: \`CCEM Desktop_*_x64-setup.exe\`"
            echo
            echo "### CLI"
            echo '```bash'
            echo "npm install -g ccem@${version}"
            echo '```'
            echo
            echo "### macOS trust"
            echo "Production artifacts are Developer ID-signed, notarized, and stapled before publication."
            echo
            echo "### Commits"
            if [[ -n "$previous_tag" ]]; then
              git log "${previous_tag}..${GITHUB_SHA}" --reverse --pretty=format:'- %s (%h)'
            else
              git log --reverse --pretty=format:'- %s (%h)'
            fi
            echo
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate release version consistency
        env:
          EXPECTED_VERSION: ${{ steps.release-notes.outputs.version }}
        run: node scripts/ci/check-release-version.mjs "$EXPECTED_VERSION"

      - name: Verify pinned browser runtime manifests
        run: node scripts/ci/check-browser-runtime-manifests.mjs

      - name: Require immutable GitHub Releases before signed build
        env:
          CCEM_RELEASE_SETTINGS_TOKEN: ${{ secrets.CCEM_RELEASE_SETTINGS_TOKEN }}
        run: node apps/desktop/scripts/verify-immutable-releases-enabled.mjs

  signed-producer:
    name: Produce Exact Signed Desktop Evidence and Payloads
    needs: prepare-release
    if: ${{ !cancelled() && needs.prepare-release.result == 'success' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/mode2-signed-producer.yml
    with:
      version: ${{ needs.prepare-release.outputs.version }}
      source_commit: ${{ github.sha }}
      caller_workflow_ref: ${{ github.workflow_ref }}
      export_release_payload: true
      release_tag: ${{ needs.prepare-release.outputs.current_tag }}

  dsh_bundle_smoke:
    name: Verify DSH in Exact Signed Payload (${{ matrix.target }})
    needs: signed-producer
    if: ${{ !cancelled() && needs.signed-producer.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Download this attempt's exact signed target payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mode2-release-payload-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: release-payload

      - name: Smoke DSH helper from exact macOS updater app
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          updater_relative="$(
            node -e '
              const fs = require("node:fs");
              const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const value = manifest?.assets?.updater?.relativePath;
              if (typeof value !== "string" || !new RegExp("^assets/[^/]+$", "u").test(value)) {
                throw new Error("payload manifest has no exact updater asset");
              }
              process.stdout.write(value);
            ' release-payload/payload-manifest.json
          )"
          updater_path="release-payload/${updater_relative}"
          [[ -f "$updater_path" ]] || {
            echo "Signed macOS updater payload is missing: $updater_path" >&2
            exit 1
          }
          extract_root="$RUNNER_TEMP/dsh-payload-${{ matrix.target }}"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          tar -xzf "$updater_path" -C "$extract_root"
          shopt -s nullglob
          app_matches=("$extract_root"/*.app)
          if [[ "${#app_matches[@]}" -ne 1 ]]; then
            echo "Expected exactly one app in signed updater payload; found ${#app_matches[@]}" >&2
            printf '%s\n' "${app_matches[@]}" >&2
            exit 1
          fi
          node apps/desktop/scripts/verify-dsh-bundle-smoke.mjs \
            --app-bundle "${app_matches[0]}" \
            --evidence "$RUNNER_TEMP/dsh-bundle-smoke-${{ matrix.target }}.json"

      - name: Smoke DSH helper from exact Windows installer
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadRoot = (Resolve-Path 'release-payload').Path
          $manifest = Get-Content -LiteralPath (Join-Path $payloadRoot 'payload-manifest.json') -Raw | ConvertFrom-Json
          $relative = [string]$manifest.assets.updater.relativePath
          if ($relative -notmatch '^assets/[^/]+$') {
            throw 'Payload manifest has no exact updater asset'
          }
          $installer = Join-Path $payloadRoot ($relative.Replace('/', [IO.Path]::DirectorySeparatorChar))
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Signed Windows updater payload is missing: $installer"
          }
          $evidence = Join-Path $env:RUNNER_TEMP "dsh-bundle-smoke-${{ matrix.target }}.json"
          node apps/desktop/scripts/verify-dsh-bundle-smoke.mjs --nsis-installer $installer --evidence $evidence

      - name: Retain DSH signed-payload smoke evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dsh-bundle-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/dsh-bundle-smoke-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90

  publish-updater-manifest:
    name: Mutate and Publish Exact Release
    needs: [prepare-release, signed-producer, dsh_bundle_smoke]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.signed-producer.result == 'success' && needs.dsh_bundle_smoke.result == 'success' }}
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Download immutable current-attempt release payloads
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: mode2-release-payload-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-payloads
          merge-multiple: false

      - name: Revalidate protected release source and exact tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SOURCE_COMMIT: ${{ github.sha }}
          TAG_NAME: ${{ needs.prepare-release.outputs.current_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Manual desktop release may run only from protected main." >&2
              exit 1
            }
          else
            [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]] || {
              echo "Automatic desktop release requires a formal v* tag push." >&2
              exit 1
            }
          fi
          [[ "$REF_PROTECTED" == "true" ]] || {
            echo "Desktop release requires the selected main ref or v* tag to be protected." >&2
            exit 1
          }
          if ! main_protection_verified="$(
            gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${GITHUB_REPOSITORY}/branches/main" \
              --jq '.protected == true'
          )"; then
            echo "Could not reverify main branch protection through the GitHub API." >&2
            exit 1
          fi
          [[ "$main_protection_verified" == "true" ]] || {
            echo "Desktop release requires the main branch to remain protected." >&2
            exit 1
          }
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Desktop release requires a formal semantic-version tag." >&2
            exit 1
          }
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          git fetch --force --no-tags origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          tag_commit="$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")"
          source_commit="$(git rev-parse "${SOURCE_COMMIT}^{commit}")"
          git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main || {
            echo "Desktop release source ${source_commit} is no longer reachable from origin/main." >&2
            exit 1
          }
          [[ "$tag_commit" == "$source_commit" ]] || {
            echo "Release tag ${TAG_NAME} resolves to ${tag_commit}, not current source ${source_commit}" >&2
            exit 1
          }

      - name: Verify exact three immutable payloads and eight assets
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TAG_NAME: ${{ needs.prepare-release.outputs.current_tag }}
        run: >-
          node apps/desktop/scripts/verify-release-payloads.mjs
          --payload-root release-payloads
          --version "${VERSION}"
          --source-commit "${GITHUB_SHA}"
          --tag "${TAG_NAME}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --inventory-output release-payloads/verified-release-inventory.json
          --contract-output release-payloads/verified-payload-contract.json

      - name: Create or resume the exact current-run draft release
        id: draft-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.current_tag }}
          RELEASE_NAME: CCEM v${{ needs.prepare-release.outputs.version }}
          RELEASE_BODY: ${{ needs.prepare-release.outputs.release_body }}
          SOURCE_COMMIT: ${{ github.sha }}
          PRERELEASE: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          ALLOW_STALE_DRAFT_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_stale_draft || 'false' }}
        run: node apps/desktop/scripts/ensure-draft-github-release.mjs

      - name: Upload the exact eight verified target assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.current_tag }}
          EXPECTED_RELEASE_ID: ${{ steps.draft-release.outputs.release_id }}
          EXPECTED_RELEASE_OWNER_RUN_ID: ${{ steps.draft-release.outputs.release_owner_run_id }}
          EXPECTED_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          CCEM_RELEASE_PAYLOAD_CONTRACT: ${{ github.workspace }}/release-payloads/verified-payload-contract.json
          CCEM_RELEASE_PAYLOAD_ROOT: ${{ github.workspace }}/release-payloads
          CCEM_RELEASE_RECEIPTS_DIR: ${{ github.workspace }}/release-receipts
          CCEM_RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        working-directory: apps/desktop
        run: node scripts/upload-draft-release-assets.mjs --mode payload

      - name: Generate latest.json from verified current-run payload
        shell: bash
        env:
          TAG_NAME: ${{ needs.prepare-release.outputs.current_tag }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          CCEM_RELEASE_PAYLOAD_CONTRACT: ${{ github.workspace }}/release-payloads/verified-payload-contract.json
          CCEM_RELEASE_LATEST_PATH: ${{ github.workspace }}/latest.json
        run: |
          set -euo pipefail
          export PUB_DATE
          PUB_DATE="$(git show -s --format=%cI "${TAG_NAME}^{commit}")"
          node apps/desktop/scripts/create-latest-from-release-payload.mjs

      - name: Upload exact latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.current_tag }}
          EXPECTED_RELEASE_ID: ${{ steps.draft-release.outputs.release_id }}
          EXPECTED_RELEASE_OWNER_RUN_ID: ${{ steps.draft-release.outputs.release_owner_run_id }}
          EXPECTED_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          CCEM_RELEASE_ASSET_PATH: ${{ github.workspace }}/latest.json
          CCEM_RELEASE_RECEIPT_PATH: ${{ github.workspace }}/latest-upload-receipt.json
        working-directory: apps/desktop
        run: node scripts/upload-draft-release-assets.mjs --mode latest

      - name: Verify exact nine assets and publish the locked draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCEM_RELEASE_SETTINGS_TOKEN: ${{ secrets.CCEM_RELEASE_SETTINGS_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.current_tag }}
          EXPECTED_RELEASE_ID: ${{ steps.draft-release.outputs.release_id }}
          EXPECTED_RELEASE_OWNER_RUN_ID: ${{ steps.draft-release.outputs.release_owner_run_id }}
          EXPECTED_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
          CCEM_RELEASE_INVENTORY_PATH: ${{ github.workspace }}/release-payloads/verified-release-inventory.json
          CCEM_RELEASE_RECEIPTS_DIR: ${{ github.workspace }}/release-receipts
          CCEM_RELEASE_LATEST_RECEIPT_PATH: ${{ github.workspace }}/latest-upload-receipt.json
          CCEM_RELEASE_LATEST_PATH: ${{ github.workspace }}/latest.json
          DESIRED_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
        working-directory: apps/desktop
        run: node scripts/publish-draft-github-release.mjs

  create-universal:
    name: Create Universal Binary
    needs: signed-producer
    runs-on: macos-latest
    if: ${{ !cancelled() && needs.signed-producer.result == 'success' }}
    permissions: {}

    steps:
      - name: Note
        run: |
          echo "Universal binary creation can be added later if needed."
          echo "For now, both aarch64 and x86_64 DMGs are uploaded to the release."
