name: CI

on:
  push:
    branches: [main, refactor, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  production-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Audit production dependencies
        run: pnpm audit:prod:high

  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Install tmux integration-test dependency
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Verify pinned browser runtime manifests
        run: pnpm check:browser-runtime-manifests

      - name: Run tests
        run: pnpm -r test:run

      - name: Build all packages
        run: pnpm -r build

      - name: TypeScript type check
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit

      - name: Rust clippy
        run: node scripts/ci/run-rust-clippy.mjs apps/desktop/src-tauri

      - name: Run Rust tests
        env:
          CCEM_REQUIRE_TMUX_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: node scripts/ci/run-rust-tests.mjs apps/desktop/src-tauri

  desktop-bundle-smoke:
    name: Desktop Bundle Smoke (${{ matrix.target }})
    needs:
      - production-audit
      - test
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    if: ${{ needs.production-audit.result == 'success' && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          key: desktop-bundle-smoke-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install

      - name: Build core package
        run: pnpm --filter @ccem/core build

      - name: Build final desktop bundle
        working-directory: apps/desktop
        run: >-
          pnpm tauri build --ci
          --target ${{ matrix.target }}
          --config src-tauri/tauri.bundle-smoke.conf.json
          --bundles ${{ matrix.bundles }}

      - name: Smoke DSH helper from final macOS app bundle
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app_bundle="$(find "$bundle_root" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo "macOS app bundle was not produced under $bundle_root" >&2
            exit 1
          fi
          node apps/desktop/scripts/verify-dsh-bundle-smoke.mjs \
            --app-bundle "$app_bundle" \
            --evidence "$RUNNER_TEMP/dsh-bundle-smoke-${{ matrix.target }}.json"

      - name: Smoke DSH helper from final Windows installer
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleRoot -Filter "*.exe" -File |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows NSIS installer was not produced under $bundleRoot"
          }
          $evidence = Join-Path $env:RUNNER_TEMP "dsh-bundle-smoke-${{ matrix.target }}.json"
          node apps/desktop/scripts/verify-dsh-bundle-smoke.mjs --nsis-installer $installer.FullName --evidence $evidence

      - name: Upload DSH bundle smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsh-bundle-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/dsh-bundle-smoke-${{ matrix.target }}.json
          if-no-files-found: error

      - name: Upload Windows installer smoke artifact
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: ccem-desktop-windows-installer-smoke
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  i18n-check:
    name: i18n Key Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check i18n key consistency
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const zhPath = 'apps/desktop/src/locales/zh.json';
          const enPath = 'apps/desktop/src/locales/en.json';

          if (!fs.existsSync(zhPath) || !fs.existsSync(enPath)) {
            console.log('⚠️  Locale files not found, skipping check');
            process.exit(0);
          }

          const zh = JSON.parse(fs.readFileSync(zhPath, 'utf8'));
          const en = JSON.parse(fs.readFileSync(enPath, 'utf8'));

          function flattenKeys(obj, prefix = '') {
            let keys = [];
            for (const [key, value] of Object.entries(obj)) {
              const fullKey = prefix ? \`\${prefix}.\${key}\` : key;
              if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                keys = keys.concat(flattenKeys(value, fullKey));
              } else {
                keys.push(fullKey);
              }
            }
            return keys;
          }

          const zhKeys = new Set(flattenKeys(zh));
          const enKeys = new Set(flattenKeys(en));

          const missingInEn = [...zhKeys].filter(k => !enKeys.has(k));
          const missingInZh = [...enKeys].filter(k => !zhKeys.has(k));

          let hasError = false;

          if (missingInEn.length > 0) {
            console.error('❌ Keys missing in en.json:');
            missingInEn.forEach(k => console.error('  - ' + k));
            hasError = true;
          }

          if (missingInZh.length > 0) {
            console.error('❌ Keys missing in zh.json:');
            missingInZh.forEach(k => console.error('  - ' + k));
            hasError = true;
          }

          if (!hasError) {
            console.log('✅ i18n keys are consistent');
          } else {
            process.exit(1);
          }
          "

  file-size-check:
    name: File Size Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check file sizes
        run: bash scripts/check-file-size.sh
