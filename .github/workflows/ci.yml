name: CI

on:
  push:
    branches: [main, refactor, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Install tmux integration-test dependency
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Audit production dependencies
        run: pnpm audit:prod:high

      - name: Verify pinned browser runtime manifests
        run: pnpm check:browser-runtime-manifests

      - name: Run tests
        run: pnpm -r test:run

      - name: Build all packages
        run: pnpm -r build

      - name: TypeScript type check
        working-directory: apps/desktop
        run: pnpm exec tsc --noEmit

      - name: Rust clippy
        run: node scripts/ci/run-rust-clippy.mjs apps/desktop/src-tauri

      - name: Run Rust tests
        env:
          CCEM_REQUIRE_TMUX_TESTS: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: node scripts/ci/run-rust-tests.mjs apps/desktop/src-tauri

  windows-installer-smoke:
    name: Windows Installer Smoke
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    if: ${{ needs.test.result == 'success' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          key: windows-installer-smoke

      - name: Install dependencies
        run: pnpm install

      - name: Build core package
        run: pnpm --filter @ccem/core build

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: pnpm tauri build --ci --config src-tauri/tauri.windows.ci.conf.json --bundles nsis

      - name: Upload Windows installer smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccem-desktop-windows-installer-smoke
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  i18n-check:
    name: i18n Key Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check i18n key consistency
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const zhPath = 'apps/desktop/src/locales/zh.json';
          const enPath = 'apps/desktop/src/locales/en.json';

          if (!fs.existsSync(zhPath) || !fs.existsSync(enPath)) {
            console.log('⚠️  Locale files not found, skipping check');
            process.exit(0);
          }

          const zh = JSON.parse(fs.readFileSync(zhPath, 'utf8'));
          const en = JSON.parse(fs.readFileSync(enPath, 'utf8'));

          function flattenKeys(obj, prefix = '') {
            let keys = [];
            for (const [key, value] of Object.entries(obj)) {
              const fullKey = prefix ? \`\${prefix}.\${key}\` : key;
              if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                keys = keys.concat(flattenKeys(value, fullKey));
              } else {
                keys.push(fullKey);
              }
            }
            return keys;
          }

          const zhKeys = new Set(flattenKeys(zh));
          const enKeys = new Set(flattenKeys(en));

          const missingInEn = [...zhKeys].filter(k => !enKeys.has(k));
          const missingInZh = [...enKeys].filter(k => !zhKeys.has(k));

          let hasError = false;

          if (missingInEn.length > 0) {
            console.error('❌ Keys missing in en.json:');
            missingInEn.forEach(k => console.error('  - ' + k));
            hasError = true;
          }

          if (missingInZh.length > 0) {
            console.error('❌ Keys missing in zh.json:');
            missingInZh.forEach(k => console.error('  - ' + k));
            hasError = true;
          }

          if (!hasError) {
            console.log('✅ i18n keys are consistent');
          } else {
            process.exit(1);
          }
          "

  file-size-check:
    name: File Size Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check file sizes
        run: bash scripts/check-file-size.sh
