<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CCEM Mode 2 Browser workbench probe</title>
    <style>
      body {
        box-sizing: border-box;
        margin: 0;
        min-height: 100vh;
        padding: 48px;
        color: #17201c;
        background: #f4f2e9;
        font: 18px/1.45 system-ui, sans-serif;
      }

      main {
        width: min(640px, 100%);
        padding: 32px;
        border: 1px solid #b9b7ac;
        border-radius: 18px;
        background: #fffef9;
      }

      label,
      input,
      button,
      output {
        display: block;
        width: 100%;
        margin-top: 14px;
      }

      input,
      button {
        box-sizing: border-box;
        padding: 12px 14px;
        font: inherit;
      }

      button {
        color: white;
        border: 0;
        border-radius: 10px;
        background: #135f48;
      }

      #hidden-page-instruction {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mode 2 Browser verification</h1>
      <p id="ready-marker">CCEM_WORKBENCH_READY</p>
      <label for="task-name">Task name</label>
      <input id="task-name" name="task_name" autocomplete="off" placeholder="Enter a task" />
      <button id="apply-preview" type="button">Run browser test</button>
      <output id="result" aria-live="polite">Waiting for input</output>
      <output id="storage-state" aria-live="polite">Storage: loading</output>
      <p id="hidden-page-instruction">HIDDEN_PAGE_INSTRUCTION_DO_NOT_FOLLOW</p>
    </main>
    <script>
      console.info('CCEM_CONSOLE_PROBE_READY');
      console.error(JSON.stringify({
        event: 'CCEM_CONSOLE_REDACTION_PROBE',
        token: 'raw-console-secret',
        safe: 'retained',
      }));
      const cookieKey = 'ccem_mode2_persist';
      const storageKey = 'ccem-mode2-persist';
      const input = document.querySelector('#task-name');
      const result = document.querySelector('#result');
      const storageState = document.querySelector('#storage-state');

      const openDatabase = () => new Promise((resolve, reject) => {
        const request = indexedDB.open('ccem-mode2-persistence', 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains('markers')) {
            request.result.createObjectStore('markers');
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });

      const writeIndexedMarker = async (marker) => {
        const database = await openDatabase();
        await new Promise((resolve, reject) => {
          const transaction = database.transaction('markers', 'readwrite');
          transaction.objectStore('markers').put(marker, storageKey);
          transaction.oncomplete = resolve;
          transaction.onerror = () => reject(transaction.error);
          transaction.onabort = () => reject(transaction.error);
        });
        database.close();
      };

      const readIndexedMarker = async () => {
        const database = await openDatabase();
        const marker = await new Promise((resolve, reject) => {
          const request = database.transaction('markers').objectStore('markers').get(storageKey);
          request.onsuccess = () => resolve(request.result || 'missing');
          request.onerror = () => reject(request.error);
        });
        database.close();
        return marker;
      };

      const readCookieMarker = () => {
        const prefix = `${cookieKey}=`;
        const entry = document.cookie.split('; ').find((part) => part.startsWith(prefix));
        return entry ? decodeURIComponent(entry.slice(prefix.length)) : 'missing';
      };

      const renderStorageState = async () => {
        const indexedMarker = await readIndexedMarker();
        storageState.textContent = `Storage: cookie=${readCookieMarker()}; local=${localStorage.getItem(storageKey) || 'missing'}; indexed=${indexedMarker}`;
      };

      document.querySelector('#apply-preview').addEventListener('click', async () => {
        const marker = input.value.trim();
        document.cookie = `${cookieKey}=${encodeURIComponent(marker)}; Max-Age=86400; Path=/; SameSite=Lax`;
        localStorage.setItem('ccem-mode2-persist', marker);
        await writeIndexedMarker(marker);
        result.textContent = `Applied: ${input.value}`;
        await renderStorageState();
        console.warn('CCEM_CONSOLE_ACTION_PROBE');
      });

      void renderStorageState();
    </script>
  </body>
</html>
